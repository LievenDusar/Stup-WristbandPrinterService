services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=wristbands
      - POSTGRES_USER=wristbands
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      # Expose to the host (loopback only) so a backend run from the IDE can connect.
      # 5433 avoids clashing with another local Postgres on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wristbands -d wristbands"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wristband-printer:
    build: .
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SECURITY_API_KEY=${API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PRINTER_HOST=${PRINTER_HOST}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wristbands
      - SPRING_DATASOURCE_USERNAME=wristbands
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SSL_KEYSTORE_PATH=/certs/keystore.p12
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - SSL_CERT_HOSTNAME=${SSL_CERT_HOSTNAME}
    volumes:
      - certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    restart: unless-stopped

volumes:
  pgdata:
  certs:
