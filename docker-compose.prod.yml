# Production stack: ONE management service + ONE printer-worker per physical printer.
#
#   management        UI + admin + DB + job history + routing. Public, HTTPS on 8443.
#                     Connects to the remote `stup_wristband_db` database on the Symfony
#                     Postgres instance (there is NO DB container here).
#   printer-worker-N  Thin print-only service, one per Zebra printer. Internal HTTP
#                     on 8080 (not published); no DB, no UI. Receives ready-to-print
#                     ZPL from management and writes it to its printer (PRINTERn_HOST).
#
# Printers self-register with management — there is no static printer registry to maintain.
# Each printer-worker carries WORKER_ID, WORKER_DISPLAY_NAME, WORKER_BASE_URL and
# WORKER_MANAGEMENT_BASE_URL and registers itself (+ heartbeats) on startup.
#
# Prerequisites:
#   1. ./build.sh                  (build the wristband-base image)
#   2. cp .env.example .env.prod   (fill in real values)
#   3. DBA has created an empty `stup_wristband_db` database + role on the prod Postgres.
# Run:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#   # https://<MANAGEMENT_HOSTNAME>:8443/jobs.html   (self-signed cert)
#
# ADD A PRINTER:
#   Copy the `printer-worker-2` template below; give it a unique service name, its own
#   PRINTERn_HOST (add that variable to .env.prod), and its own WORKER_ID / WORKER_DISPLAY_NAME /
#   WORKER_BASE_URL. See docs/production-deployment.md for the worker -> management TLS
#   prerequisite before setting a live WORKER_MANAGEMENT_BASE_URL.

x-worker-base: &worker-base
  image: wristband-printer
  build: .
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m
        cpus: "1.0"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # --- One thin worker per physical printer (internal HTTP, no DB, no UI) ---
  printer-worker-1:
    <<: *worker-base
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SECURITY_API_KEY: ${API_KEY}
      PRINTER_HOST: ${PRINTER1_HOST}

  # --- Printer-worker template: copy this block to add a printer ---
  # printer-worker-2:
  #   <<: *worker-base
  #   environment:
  #     SPRING_PROFILES_ACTIVE: worker
  #     SECURITY_API_KEY: ${API_KEY}
  #     PRINTER_HOST: ${PRINTER2_HOST}

  # --- Management: the only public, HTTPS, DB-connected service ---
  management:
    image: wristband-printer
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_API_KEY: ${API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SSL_KEYSTORE_PATH: /certs/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD}
      SSL_CERT_HOSTNAME: ${MANAGEMENT_HOSTNAME:-localhost}
      # Printers self-register (no static registry). Each printer-worker below must set:
      #   WORKER_ID, WORKER_DISPLAY_NAME, WORKER_BASE_URL, WORKER_MANAGEMENT_BASE_URL
      # PREREQUISITE (not yet wired): worker -> management is HTTPS-only here; before
      # enabling prod self-registration, add an internal HTTP connector for /api/internal/**
      # on management OR make the worker RestClient trust the internal cert. See
      # docs/production-deployment.md.
    ports:
      - "8443:8443"
    volumes:
      - certs-management:/certs
    depends_on:
      - printer-worker-1
    healthcheck:
      # Internal container port is always 8443; only the published host port differs.
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  certs-management:
