# Production stack: ONE management service + ONE printer-worker per physical printer.
#
#   management        UI + admin + DB + job history + routing. Public, HTTPS on 8443.
#                     Connects to the remote `wristbands` database on the Symfony
#                     Postgres instance (there is NO DB container here).
#   printer-worker-N  Thin print-only service, one per Zebra printer. Internal HTTP
#                     on 8080 (not published); no DB, no UI. Receives ready-to-print
#                     ZPL from management and writes it to its printer (PRINTERn_HOST).
#
# Management routes a job to a worker using the printer registry in its
# SPRING_APPLICATION_JSON (each entry: id + display-name + the worker's in-network URL).
#
# Prerequisites:
#   1. ./build.sh                  (build the wristband-base image)
#   2. cp .env.example .env.prod   (fill in real values)
#   3. DBA has created an empty `wristbands` database + role on the prod Postgres.
# Run:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#   # https://<MANAGEMENT_HOSTNAME>:8443/jobs.html   (self-signed cert)
#
# ADD A PRINTER (two coordinated edits):
#   1. Copy the `printer-worker-2` template below; give it a unique service name and its
#      own PRINTERn_HOST (add that variable to .env.prod).
#   2. Add a matching entry to the management `SPRING_APPLICATION_JSON` registry:
#      {"id":"printer-2","display-name":"<label>","base-url":"http://printer-worker-2:8080"}
#   The `id` is the value Symfony sends as `printerId`; the `base-url` host MUST equal the
#   worker's service name.

x-worker-base: &worker-base
  image: wristband-printer
  build: .
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m
        cpus: "1.0"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # --- One thin worker per physical printer (internal HTTP, no DB, no UI) ---
  printer-worker-1:
    <<: *worker-base
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SECURITY_API_KEY: ${API_KEY}
      PRINTER_HOST: ${PRINTER1_HOST}

  # --- Printer-worker template: copy this block to add a printer ---
  # printer-worker-2:
  #   <<: *worker-base
  #   environment:
  #     SPRING_PROFILES_ACTIVE: worker
  #     SECURITY_API_KEY: ${API_KEY}
  #     PRINTER_HOST: ${PRINTER2_HOST}

  # --- Management: the only public, HTTPS, DB-connected service ---
  management:
    image: wristband-printer
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_API_KEY: ${API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SSL_KEYSTORE_PATH: /certs/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD}
      SSL_CERT_HOSTNAME: ${MANAGEMENT_HOSTNAME:-localhost}
      # Printer registry — one entry per worker. ADD a line here when you add a printer.
      SPRING_APPLICATION_JSON: '{
        "cluster":
          {"printers":[
            {"id":"printer-1", "display-name":"Secretariaat", "base-url":"http://printer-worker-1:8080"}
          ]}
        }'
    ports:
      - "8443:8443"
    volumes:
      - certs-management:/certs
    depends_on:
      - printer-worker-1
    healthcheck:
      # Internal container port is always 8443; only the published host port differs.
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  certs-management:
