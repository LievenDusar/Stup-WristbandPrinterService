server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:${SSL_KEYSTORE_PATH:/certs/keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-alias: wristband

printer:
  # Only the worker profile actually prints; the management service never uses this,
  # so it defaults to localhost and is overridden by PRINTER_HOST on each worker.
  host: ${PRINTER_HOST:localhost}
  port: 9100
  timeout-ms: 5000

security:
  api-key: ${SECURITY_API_KEY}   # set via environment variable
  admin:
    password: ${ADMIN_PASSWORD}

labelary:
  base-url: http://api.labelary.com

