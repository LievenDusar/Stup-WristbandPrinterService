server:
  port: 8443
  # Plain-HTTP connector for in-network worker -> management calls (self-registration,
  # heartbeat). Not published to the host (see docker-compose.prod.yml) — only reachable on
  # the private Docker network. The main 8443 connector stays HTTPS-only.
  internal-http:
    enabled: ${INTERNAL_HTTP_ENABLED:true}
    port: ${INTERNAL_HTTP_PORT:8081}
  ssl:
    enabled: true
    key-store: file:${SSL_KEYSTORE_PATH:/certs/keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-alias: wristband

printer:
  # Only the worker profile actually prints; the management service never uses this,
  # so it defaults to localhost and is overridden by PRINTER_HOST on each worker.
  host: ${PRINTER_HOST:localhost}
  port: 9100
  timeout-ms: 5000
  # Defensive: prepended to every job to wipe the printer's RAM drive (R:) before each label,
  # guarding against object build-up that historically stalled the printer after a number of
  # prints. Normally a no-op since images are sent inline (^GFA). Override clear-command if your
  # printer model needs a different reset, or set clear-cache-enabled=false to disable.
  clear-cache-enabled: true
  clear-command: "^XA^IDR:*.*^FS^XZ"

security:
  api-key: ${SECURITY_API_KEY}   # set via environment variable
  admin:
    password: ${ADMIN_PASSWORD}
  cookie-secret: ${COOKIE_SECRET}

labelary:
  base-url: http://api.labelary.com

