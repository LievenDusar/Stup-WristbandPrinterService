<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUP — Print Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="app-header">
      <h1>STUP Print Queue</h1>
      <div style="display:flex;align-items:center;gap:14px">
        <span id="sse-status" class="reconnecting">Connecting…</span>
        <a class="btn btn-sm" href="/template-editor.html">Template editor</a>
        <button class="btn btn-sm" onclick="logout()">Sign out</button>
      </div>
    </div>

    <div class="chips" id="chips"></div>
    <div class="chips" id="printer-chips"></div>

    <div class="controls">
      <div class="search">
        <input class="input" id="search" type="text" placeholder="Search by name, job ID or event…" oninput="render()">
        <button type="button" class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="Clear search" title="Clear">×</button>
      </div>
      <button class="btn btn-danger" onclick="clearCompleted()">Clear completed</button>
    </div>

    <div class="glass" style="overflow:hidden">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('jobId')">Job ID</th>
            <th onclick="sortBy('firstName')">Name</th>
            <th onclick="sortBy('eventName')">Event</th>
            <th onclick="sortBy('printerName')">Printer</th>
            <th onclick="sortBy('status')">Status</th>
            <th onclick="sortBy('submittedAt')">Submitted</th>
            <th onclick="sortBy('completedAt')">Completed</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-body">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div id="drawer-content"></div>
  </aside>

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="glass confirm-card">
      <div id="confirm-message"></div>
      <div class="confirm-actions">
        <button class="btn" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="/js/jobs.js"></script>
</body>
</html>
