server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  api-key: changeme  # Override via security.api-key env var or profile YAML in all real environments
  admin:
    username: admin
    # password supplied per-profile / via env (SECURITY_ADMIN_PASSWORD); never defaulted in base
  cookie:
    secure: true       # send cookie only over HTTPS (overridden in local)
    same-site: Strict  # overridden to Lax in local
  # cookie-secret: required in prod (COOKIE_SECRET env var); if unset in dev the signing key falls back to the admin password

printer:
  host: localhost
  port: 9100
  timeout-ms: 5000
  max-retries: 2          # additional attempts after the first on transient socket failure
  retry-backoff-ms: 500   # pause between retries
  clear-cache-enabled: true               # prepend a clear command to every job (defensive)
  clear-command: "^XA^IDR:*.*^FS^XZ"      # wipes objects from the printer's RAM drive (R:) before each label

queue:
  max-depth: 100          # max pending jobs PER PRINTER before new submissions are rejected with 429

print:
  max-copies: 200         # hard cap on copies per job (^PQ); requests above this are rejected with 400

wristband:
  width-dots: 300
  length-dots: 3300
  dpi: 300
  logo-path: classpath:images/stup-logo.png
  logo-side-margin-dots: 75
  margins:
    between-logo-and-barcode: 30   # top logo -> barcode
    between-barcode-and-text: 120   # barcode -> text
    between-text-and-logo: 120      # text -> bottom logo (kept equal to barcode->text for centered text)
  text:
    font-size-event: 45
    font-size-name: 74
    font-size-club: 45
  barcode:
    type: CODE128
    height-dots: 270
    module-width-dots: 3   # wider narrow-bar -> longer along the band & reliably scannable
    show-human-readable: false
  # Preview-only stock-color palette (ZPL is always monochrome).
  # Keys are integer codes; values are CSS hex strings. Code 1 = white is the default.
  stock-colors:
    1: "#FFFFFF"   # white (default / plain stock — no visual tint)
    2: "#800080"   # purple
    3: "#FFFF00"   # yellow
    4: "#0000FF"   # blue
    5: "#008000"   # green
    6: "#FF0000"   # red
  permit:
    event-logo-path: classpath:images/pkp-logo-short.png
    margins:
      between-blocks: 60        # ~5 mm at 300 DPI — uniform gap between every block pair
      writing-space-gap: 55    # inside block 2; gives room to write by hand
    text:
      font-size-permit-label: 66
      font-size-club: 42
      font-size-event-name: 52
      dot-count: 60             # '.' characters when no clubName is supplied
    code:
      default-symbology: CODE128
      height-dots: 200
      module-width-dots: 2
      show-human-readable: false

labelary:
  base-url: http://api.labelary.com
  timeout-ms: 5000

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.stup.wristbandprinter: INFO
