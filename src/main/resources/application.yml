server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/printjobs;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  api-key: changeme  # Override via security.api-key env var or profile YAML in all real environments

printer:
  host: localhost
  port: 9100
  timeout-ms: 5000
  max-retries: 2          # additional attempts after the first on transient socket failure
  retry-backoff-ms: 500   # pause between retries

queue:
  max-depth: 100          # max pending jobs before new submissions are rejected with 429

wristband:
  width-dots: 300
  length-dots: 3300
  dpi: 300
  logo-path: classpath:images/stup-logo.png
  logo-side-margin-dots: 75
  margins:
    top-dots: 59
    between-logo-and-text: 30
    between-text-and-barcode: 40
    between-barcode-and-logo: 70
  text:
    font-size-event: 45
    font-size-name: 74
    font-size-association: 45
  barcode:
    type: CODE128
    height-dots: 270
    show-human-readable: false

labelary:
  base-url: http://api.labelary.com
  timeout-ms: 5000

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.stup.wristbandprinter: INFO
