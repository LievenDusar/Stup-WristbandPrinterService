server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  api-key: changeme  # Override via security.api-key env var or profile YAML in all real environments
  admin:
    username: admin
    # password supplied per-profile / via env (SECURITY_ADMIN_PASSWORD); never defaulted in base
  cookie:
    secure: true       # send cookie only over HTTPS (overridden in local)
    same-site: Strict  # overridden to Lax in local
  # cookie-secret: optional; if unset the cookie signing key is derived from the admin password

printer:
  host: localhost
  port: 9100
  timeout-ms: 5000
  max-retries: 2          # additional attempts after the first on transient socket failure
  retry-backoff-ms: 500   # pause between retries

queue:
  max-depth: 100          # max pending jobs PER PRINTER before new submissions are rejected with 429

cluster:
  # Registry of printer-workers this management service can route to. Each printer
  # is one worker container. The base-url below is a sentinel that MUST be overridden
  # per environment (application-local.yml for dev, env/compose for prod): a job sent
  # to it fails loudly with the bad URL rather than silently misrouting.
  printers:
    - id: printer-1
      display-name: Printer 1
      base-url: http://printer-worker-not-configured:8080

wristband:
  width-dots: 300
  length-dots: 3300
  dpi: 300
  logo-path: classpath:images/stup-logo.png
  logo-side-margin-dots: 75
  margins:
    between-logo-and-barcode: 30   # top logo -> barcode
    between-barcode-and-text: 120   # barcode -> text
    between-text-and-logo: 120      # text -> bottom logo (kept equal to barcode->text for centered text)
  text:
    font-size-event: 45
    font-size-name: 74
    font-size-association: 45
  barcode:
    type: CODE128
    height-dots: 270
    module-width-dots: 3   # wider narrow-bar -> longer along the band & reliably scannable
    show-human-readable: false

labelary:
  base-url: http://api.labelary.com
  timeout-ms: 5000

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.stup.wristbandprinter: INFO
