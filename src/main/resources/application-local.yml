spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stup_wristband_db
    username: wristbands
    password: wristbands
  # Local-only: never let the browser cache the editor's HTML/JS/CSS, so a restart
  # always serves the latest code (prevents "I'm running old JS" confusion in dev).
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

printer:
  host: localhost # replace with your printer IP for local testing
  port: 9100
  timeout-ms: 3000

wristband:
  logo-path: classpath:images/stup-logo.png

security:
  api-key: local-dev-key
  admin:
    # BCrypt hash of "local-admin" — generate a new hash for any real environment
    password: "$2b$10$4OFfW8WbtJc1qYni/zJByuL.HggdKiGFS.RO3J6KEa5czu3.g1tg6"
  cookie:
    secure: false
    same-site: Lax

labelary:
  base-url: http://api.labelary.com
